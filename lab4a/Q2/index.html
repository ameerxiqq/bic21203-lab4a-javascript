<!DOCTYPE html>
<html>
<head>
    <title>Question 2 - Number Validator</title>
</head>
<body>

    <h2>Smart Number Validator</h2>

    <label for="userInput">Enter a number:</label>

    <input
        type="text"
        id="userInput"
        placeholder="Enter a number"
    >

    <button id="checkBtn" type="button">Check</button>

    <p id="result" role="status" aria-live="polite"></p>

    <script src="script.js" defer></script>

</body>
</html>
